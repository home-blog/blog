<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="여러 사람이 쓰는 블로그를 한곳에서. 여행·음식·취미·운동·개발 이야기를 원고지에 담습니다." />
    <!-- 밝게/어둡게를 그리기 전에 정한다 (specs/007 US1, 저장 이름은 src/theme/theme.ts와 같다).
         나중에 CSP를 걸면 이 스크립트의 해시를 script-src에 넣는다 (specs/003 D-9) -->
    <script>
      (function () {
        var theme = null
        try {
          theme = localStorage.getItem('geulgyeol-theme')
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
    />
    <title>글결</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
