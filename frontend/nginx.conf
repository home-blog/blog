# 화면 컨테이너 안의 Nginx (배포용). 바깥(실습 서버) Nginx → 이 컨테이너(80) → /api는 서버 컨테이너(8080)

# 링크 미리보기 로봇 (specs/007 US4): 자바스크립트를 실행하지 않아 화면(index.html)만으로는 카드를 못 만든다.
# 이 로봇이 첫 화면·블로그·글 주소를 열면 서버가 만든 카드 HTML(/og/…)을 준다. 사람과 Google 등은 지금처럼 화면을 받는다
map $http_user_agent $preview_bot {
    default 0;
    "~*(kakaotalk-scrap|discordbot|slackbot|slack-imgproxy|facebookexternalhit|facebot|twitterbot|telegrambot|linkedinbot|whatsapp|line-poker|skypeuripreview|redditbot|yeti|daumoa)" 1;
}

# 로봇이 연 주소가 카드가 있는 화면 주소일 때만 그 주소, 아니면 빈 값 (그림·파일 요청은 그대로 둔다)
map "$preview_bot:$uri" $og_path {
    default "";
    "~^1:(/|/posts/[0-9]+|/blog/[0-9]+)$" $uri;
}

server {
    listen 80;
    server_name _;

    # 이미지 한 장 5MB(community.image.max-size) + 여유
    client_max_body_size 8M;

    root /usr/share/nginx/html;

    # 서버 API: 같은 주소(/api)로 넘겨 세션 쿠키·CSRF가 그대로 동작한다
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        # 바깥 Nginx가 알려 준 원래 프로토콜(http/https)을 그대로 넘긴다
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # 로봇이 읽는 주소 (specs/007 US5·US6): RSS, 사이트 지도, 검색엔진 안내는 서버가 만든다
    location ~ ^/(rss\.xml|sitemap\.xml|robots\.txt|blog/[0-9]+/rss\.xml)$ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # 링크 미리보기 카드: 아래 location /에서 로봇일 때만 이리로 넘어온다 (밖에서 직접 열 수 없음)
    location /__og/ {
        internal;
        proxy_pass http://server:8080/og/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # 서버 상태 확인은 밖에서 열지 않는다
    location /actuator/ {
        return 404;
    }

    # 빌드 결과 파일(이름에 해시가 붙음)은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면 주소(/blog/1, /posts/3 …)는 모두 index.html이 그린다
    location / {
        if ($og_path != "") {
            rewrite ^ /__og$og_path last;
        }
        add_header Cache-Control "no-cache";
        add_header Vary "User-Agent";
        try_files $uri /index.html;
    }
}
