# 화면 컨테이너 안의 Nginx (배포용). 바깥(실습 서버) Nginx → 이 컨테이너(80) → /api는 서버 컨테이너(8080)
server {
    listen 80;
    server_name _;

    # 이미지 한 장 5MB(community.image.max-size) + 여유
    client_max_body_size 8M;

    root /usr/share/nginx/html;

    # 서버 API: 같은 주소(/api)로 넘겨 세션 쿠키·CSRF가 그대로 동작한다
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        # 바깥 Nginx가 알려 준 원래 프로토콜(http/https)을 그대로 넘긴다
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # 서버 상태 확인은 밖에서 열지 않는다
    location /actuator/ {
        return 404;
    }

    # 빌드 결과 파일(이름에 해시가 붙음)은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 화면 주소(/blog/1, /posts/3 …)는 모두 index.html이 그린다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
