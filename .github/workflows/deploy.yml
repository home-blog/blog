# 실습 서버 배포: Docker 이미지를 만들어 SSH로 서버에 올리고 deploy/remote-deploy.sh로 켠다.
# main에 합친다고 바로 배포하지 않는다. 릴리스를 낼 때 그 버전을 배포한다 (2026-10-12 사용자).
# 로컬에서 어느 정도 해 두고 → 버전을 올려 → 배포 (2026-10-12 사용자): 쓸 만한 묶음이 되면 화면을 확인하고 "배포해줘" 뒤에 낸다.
#
# 릴리스 내는 두 길 (둘 다 릴리스 번호 = 서버·화면 버전 번호 = CHANGELOG.md의 "## [번호]" 절이어야 배포한다):
#   1) Actions → 배포 → Run workflow에 번호(예: 0.4.1)를 넣는다: 확인 → 배포 → 성공하면 태그 v<번호>와 GitHub 릴리스를
#      CHANGELOG의 그 절로 만든다 (Claude가 쓰는 길)
#   2) GitHub에서 릴리스(태그 v<번호>, 대상 main)를 직접 낸다: 그 태그의 커밋을 배포한다
#   번호를 비우고 손으로 돌리면 릴리스 없이 main의 지금 코드를 다시 올린다 (설정·Secrets만 바꿨을 때)
#
# 준비 (Repository secrets): SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD (실습 서버 접속)
#                            SSH_KNOWN_HOSTS (서버 지문. 내 컴퓨터에서 ssh-keyscan -p <포트> <주소> 결과. 없으면 배포를 멈춘다)
#                            DB_ADDRESS, DB_PORT, DB_NAME, DB_SCHEMA, DB_USERNAME, DB_PASSWORD (실습 DB)
#                 있으면 씀:  MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD (인증 메일. 없으면 가입이 안 된다)
#                             SOCIAL_{GITHUB|GOOGLE|KAKAO|NAVER}_CLIENT_ID, ..._CLIENT_SECRET (소셜 로그인. 없는 회사는 버튼이 안 보인다)
#                             ANTHROPIC_API_KEY (빨간 펜 AI 교정, Claude API, 유료. 없으면 무료 규칙 교정)
#                             VOYAGE_API_KEY (비슷한 글 임베딩, Voyage AI, 유료. 없으면 Ollama, 그것도 없으면 태그·주제로 대신)
#           (Repository variables, 있으면 씀): SESSION_COOKIE_SECURE (HTTPS가 붙으면 true. 없으면 false)
#                             OLLAMA_ENABLED (true면 서버에 무료 AI Ollama(bge-m3)를 켜 비슷한 글을 뜻으로 고른다.
#                                             메모리·디스크가 모자라면 remote-deploy.sh가 켜지 않는다. specs/014 D-17)
# 서버에는 ~/<DEPLOY_NAME> 폴더 하나만 쓴다. 화면 입구는 127.0.0.1:<WEB_PORT>(a)·<WEB_PORT_B>(b), 도메인 연결은 deploy/README.md 참고
# 앱 두 벌을 한 벌씩 바꾸므로(롤링) 배포 중에도 사이트가 끊기지 않는다 (specs/011)
name: 배포

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 번호 (예: 0.4.1). 넣으면 확인·배포 뒤 v<번호> 릴리스를 만든다. 비우면 릴리스 없이 main을 다시 올린다"
        type: string
        required: false
        default: ""

# 배포는 한 번에 하나씩, 도중에 끊지 않는다
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max   # 기다리는 실행을 새 실행이 대신하지 않고 차례대로 (기본은 하나만 기다리고 앞의 것을 취소)

permissions:
  contents: read

env:
  DEPLOY_NAME: geulgyeol   # 서버 폴더·컨테이너·이미지 이름
  WEB_PORT: "8410"         # 앱 a 벌의 화면 입구. 내 포트 범위(8410~8419)의 맨 처음
  WEB_PORT_B: "8411"       # 앱 b 벌의 화면 입구 (무중단 배포, specs/011). 학원 Nginx upstream에 둘 다 있다

jobs:
  check:
    name: 릴리스 확인
    # 릴리스를 냈을 때(정식판만, 미리보기 prerelease는 빼고), 또는 main에서 손으로 돌릴 때만
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # 비밀값을 쓰는 작업이라 외부 액션을 커밋으로 고정한다 (새 버전은 Dependabot이 커밋과 주석을 같이 올린다)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # 릴리스면 그 태그의 커밋, 손으로 돌리면 main의 마지막 커밋
          fetch-depth: 0            # 릴리스 커밋이 main에 있는지, 같은 태그가 이미 있는지 본다
          persist-credentials: false   # 뒤 단계는 git 인증이 필요 없다

      - name: 릴리스 번호
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = release ]; then version="${TAG#v}"; else version="${INPUT#v}"; fi
          if [ -n "$version" ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::릴리스 번호는 0.4.1처럼 숫자 세 개입니다 (받은 값: $version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "릴리스 번호: ${version:-없음 (main 다시 올리기)}"

      - name: 릴리스가 main의 커밋인지 확인
        if: github.event_name == 'release'
        run: |
          # main에 합쳐지지 않은 커밋에 태그를 붙여 릴리스를 내도 배포하지 않는다
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::릴리스 태그(${GITHUB_REF_NAME})가 main에 없는 커밋을 가리킵니다. main의 커밋으로 릴리스를 내 주세요"
            exit 1
          fi

      - name: 릴리스 기록 확인
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          # 릴리스는 항상 문서로 남긴다 (2026-10-12 사용자): 서버·화면 버전 번호가 릴리스 번호와 같고
          # CHANGELOG.md에 "## [번호]" 절이 있어야 배포한다. 손으로 낼 때는 같은 태그가 아직 없어야 한다
          pom=$(sed -n 's#^    <version>\(.*\)</version>#\1#p' backend/pom.xml | head -1)
          web=$(node -p "require('./frontend/package.json').version")
          lock=$(node -p "require('./frontend/package-lock.json').version")
          fail=0
          [ "$pom" = "$VERSION" ] || { echo "::error::backend/pom.xml 버전($pom)이 릴리스 번호($VERSION)와 다릅니다"; fail=1; }
          [ "$web" = "$VERSION" ] || { echo "::error::frontend/package.json 버전($web)이 릴리스 번호($VERSION)와 다릅니다"; fail=1; }
          [ "$lock" = "$VERSION" ] || { echo "::error::frontend/package-lock.json 버전($lock)이 릴리스 번호($VERSION)와 다릅니다 (npm install로 맞춘다)"; fail=1; }
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md에 '## [$VERSION]' 절이 없습니다"; fail=1; }
          if [ "$EVENT" = workflow_dispatch ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::태그 v$VERSION이 이미 있습니다. 번호를 올려 주세요"; fail=1
          fi
          exit "$fail"

  deploy:
    name: 실습 서버에 배포
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false   # 뒤 단계는 git 인증이 필요 없다

      - name: 이미지 만들기
        env:
          SHA: ${{ github.sha }}
        run: |
          tag="${SHA:0:12}"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          docker build -t "$DEPLOY_NAME-server:$tag" backend
          docker build -t "$DEPLOY_NAME-web:$tag" frontend
          docker save "$DEPLOY_NAME-server:$tag" "$DEPLOY_NAME-web:$tag" | gzip -1 > "$RUNNER_TEMP/images.tar.gz"
          ls -lh "$RUNNER_TEMP/images.tar.gz"

      - name: 서버 접속 준비
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # 비밀번호·DB 정보를 보내기 전에 진짜 실습 서버인지 지문으로 확인한다 (지문은 미리 확인해 Secret에 넣어 둔다)
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS Secret이 없습니다. 내 컴퓨터에서 ssh-keyscan -p <포트> <주소> 결과를 넣어 주세요 (deploy/README.md)"
            exit 1
          fi
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버에 올리고 켜기
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_ID: ${{ secrets.SSH_ID }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SOCIAL_GITHUB_CLIENT_ID: ${{ secrets.SOCIAL_GITHUB_CLIENT_ID }}
          SOCIAL_GITHUB_CLIENT_SECRET: ${{ secrets.SOCIAL_GITHUB_CLIENT_SECRET }}
          SOCIAL_GOOGLE_CLIENT_ID: ${{ secrets.SOCIAL_GOOGLE_CLIENT_ID }}
          SOCIAL_GOOGLE_CLIENT_SECRET: ${{ secrets.SOCIAL_GOOGLE_CLIENT_SECRET }}
          SOCIAL_KAKAO_CLIENT_ID: ${{ secrets.SOCIAL_KAKAO_CLIENT_ID }}
          SOCIAL_KAKAO_CLIENT_SECRET: ${{ secrets.SOCIAL_KAKAO_CLIENT_SECRET }}
          SOCIAL_NAVER_CLIENT_ID: ${{ secrets.SOCIAL_NAVER_CLIENT_ID }}
          SOCIAL_NAVER_CLIENT_SECRET: ${{ secrets.SOCIAL_NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          SESSION_COOKIE_SECURE: ${{ vars.SESSION_COOKIE_SECURE || 'false' }}
          OLLAMA_ENABLED: ${{ vars.OLLAMA_ENABLED || 'false' }}
        run: |
          # 비밀번호는 명령줄이 아닌 환경 변수(SSHPASS)로 넘긴다
          remote() { sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$SSH_ID@$SSH_ADDRESS" "$@"; }
          dir="\$HOME/$DEPLOY_NAME"   # 서버 쪽 홈 폴더 (서버에서 풀린다)

          # 1) 배포 파일 (compose, 스크립트)
          tar czf - docker-compose.deploy.yml deploy | remote "mkdir -p $dir && tar xzf - -C $dir"

          # 2) 접속 정보: 파일을 거치지 않고 바로 서버의 .env.deploy(나만 읽기)로 쓴다. 값은 셸 따옴표로 감싼다
          for k in DEPLOY_NAME WEB_PORT WEB_PORT_B IMAGE_TAG DB_ADDRESS DB_PORT DB_NAME DB_SCHEMA DB_USERNAME DB_PASSWORD \
                   MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD SESSION_COOKIE_SECURE \
                   SOCIAL_GITHUB_CLIENT_ID SOCIAL_GITHUB_CLIENT_SECRET SOCIAL_GOOGLE_CLIENT_ID SOCIAL_GOOGLE_CLIENT_SECRET \
                   SOCIAL_KAKAO_CLIENT_ID SOCIAL_KAKAO_CLIENT_SECRET SOCIAL_NAVER_CLIENT_ID SOCIAL_NAVER_CLIENT_SECRET \
                   ANTHROPIC_API_KEY VOYAGE_API_KEY OLLAMA_ENABLED; do
            if [ -n "${!k}" ]; then printf '%s=%q\n' "$k" "${!k}"; fi
          done | remote "umask 077 && cat > $dir/.env.deploy"

          # 3) 이미지
          remote "cat > $dir/images.tar.gz" < "$RUNNER_TEMP/images.tar.gz"

          # 4) 한 벌씩 바꾸기 (실패한 벌의 서버 로그는 remote-deploy.sh가 남긴다)
          remote "bash $dir/deploy/remote-deploy.sh"

  release:
    name: 릴리스 만들기
    # 손으로 번호를 넣어 돌렸고 배포가 끝났을 때만. 직접 낸 릴리스(release 이벤트)는 이미 있으므로 건너뛴다
    needs: [check, deploy]
    if: github.event_name == 'workflow_dispatch' && needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # 태그와 릴리스를 만든다 (이 작업만)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: CHANGELOG의 그 절로 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # "## [번호]" 줄 다음부터 다음 "## [" 줄 전까지가 릴리스 설명이다
          awk -v head="## [$VERSION]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
