# 실습 서버의 배포 DB에 예시 데이터(deploy/seed)를 넣거나 지운다. 서버에 직접 들어가지 않아도 된다.
# 실행: Actions → 예시 데이터 → Run workflow → add(넣기) 또는 remove(지우기)
# 서버의 ~/<DEPLOY_NAME>/.env.deploy(배포가 만든 접속 정보)를 쓰므로 배포가 한 번은 끝나 있어야 한다.
# Secrets는 배포(deploy.yml)와 같은 SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD, SSH_KNOWN_HOSTS만 쓴다.
name: 예시 데이터

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add = 넣기 (한 번만 된다), remove = 지우기"
        type: choice
        options: [add, remove]
        default: add

# 배포와 겹치지 않게 같은 줄에 선다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_NAME: geulgyeol

jobs:
  seed:
    name: 예시 데이터 ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 서버 접속 준비
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS Secret이 없습니다 (deploy/README.md)"
            exit 1
          fi
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 예시 데이터 ${{ inputs.action }}
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_ID: ${{ secrets.SSH_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          remote() { sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$SSH_ID@$SSH_ADDRESS" "$@"; }
          dir="\$HOME/$DEPLOY_NAME"   # 서버 쪽 홈 폴더 (서버에서 풀린다)
          case "$ACTION" in add|remove) ;; *) echo "::error::add 또는 remove만 됩니다"; exit 1 ;; esac
          # 이 커밋의 예시 데이터 파일을 올린 뒤 실행한다 (서버의 다른 파일은 건드리지 않는다)
          tar czf - deploy/seed | remote "mkdir -p $dir && tar xzf - -C $dir"
          remote "bash $dir/deploy/seed/run.sh $ACTION"
