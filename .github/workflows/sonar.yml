# SonarQube 품질 분석 (버그, 취약점, 중복, 테스트 커버리지) — 아카데미 SonarQube 서버 사용
# 준비: Repository secret SONAR_TOKEN, Repository variable SONAR_HOST_URL (예 http://<SonarQube 서버>:9000)
# 프로젝트 키는 sonar-project.properties에 있다.
# 토큰이 아직 없으면 이 작업은 건너뛴다.
name: SonarQube

# 문서만 바뀐 PR에서는 돌리지 않는다
on:
  pull_request:
    branches: [main, develop]   # Git Flow: 기능은 develop으로, 릴리스·급한 수정은 main으로
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]
  push:
    branches: [main, develop]   # Git Flow: 기능은 develop으로, 릴리스·급한 수정은 main으로
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]


# 코드를 읽기만 한다 (최소 권한)
permissions:
  contents: read

jobs:
  sonar:
    name: 품질 분석
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    services:
      postgres:
        image: pgvector/pgvector:pg18   # docker-compose와 같은 DB
        env:
          POSTGRES_DB: myblog
          POSTGRES_USER: myblog
          POSTGRES_PASSWORD: myblog-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myblog -d myblog"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - name: 토큰 확인
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN이 없어 SonarQube 분석을 건너뜁니다."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0   # 새로 바뀐 코드를 구분하려면 전체 이력이 필요하다
      - uses: actions/setup-java@v6
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 개발용 설정 파일 만들기
        if: env.SONAR_TOKEN != ''
        run: cp .env.example .env   # 서버가 읽는 접속 정보. 위 services의 DB 계정과 같다
      - name: 서버 빌드와 커버리지
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: mvn -B -ntp verify
      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 화면 테스트와 커버리지
        if: env.SONAR_TOKEN != ''
        working-directory: frontend
        run: npm ci && npm run test:coverage   # coverage/lcov.info를 만든다. 스캐너보다 먼저 돌아야 커버리지가 잡힌다
      - name: SonarQube 분석
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
