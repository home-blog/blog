# PR과 main에 올라온 코드를 자동으로 검사한다.
# 서버: Maven 빌드 + 테스트 (PostgreSQL, Redis를 함께 띄움) / 화면: 린트 + 타입 검사 + 빌드
name: CI

# 문서만 바뀐 PR에서는 돌리지 않는다
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 서버 (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18   # docker-compose와 같은 DB
        env:
          POSTGRES_DB: myblog
          POSTGRES_USER: myblog
          POSTGRES_PASSWORD: myblog-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myblog -d myblog"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: pgvector 확인 (나중에 임베딩을 쓸 수 있는지)
        env:
          PGPASSWORD: myblog-dev
        run: |
          psql -h localhost -U myblog -d myblog -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE TEMP TABLE vector_check (id int, embedding vector(3));
          INSERT INTO vector_check VALUES (1, '[1,2,3]'), (2, '[9,9,9]');
          SELECT id, embedding <-> '[1,2,4]' AS distance FROM vector_check ORDER BY distance LIMIT 1;
          SELECT extversion AS pgvector_version FROM pg_extension WHERE extname = 'vector';
          DROP EXTENSION vector;
          SQL
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 빌드와 테스트
        run: mvn -B -ntp verify

  frontend:
    name: 화면 (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 타입 검사와 빌드
        run: npm run build
