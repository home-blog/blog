# PR과 main에 올라온 코드를 자동으로 검사한다.
# 서버: Maven 빌드 + 테스트 (PostgreSQL, Redis를 함께 띄움) / 화면: 린트 + 타입 검사 + 빌드
name: CI

# 문서만 바뀐 PR에서는 돌리지 않는다
on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "specs/**", ".specify/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


# 코드를 읽기만 한다 (최소 권한)
permissions:
  contents: read

jobs:
  backend:
    name: 서버 (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18   # docker-compose와 같은 DB
        env:
          POSTGRES_DB: myblog
          POSTGRES_USER: myblog
          POSTGRES_PASSWORD: myblog-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myblog -d myblog"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 빌드와 테스트
        run: mvn -B -ntp verify 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: 실패 원인을 주석으로 남기기
        # 로그를 열지 않아도 PR 화면과 API에서 원인을 볼 수 있게 한다
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail   # 요약을 못 뽑아도 주석은 반드시 남긴다
          summary=$(grep -E "^\[ERROR\]|FAILURE!|Tests run:.*(Failures|Errors): [1-9]" build.log 2>/dev/null | grep -v "^\[ERROR\] *$" | head -40)
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "(Failures|Errors): [1-9]" "$f"; then
              summary+=$'\n'"$(grep -E -A6 "<<< (FAILURE|ERROR)!" "$f" | head -30)"
            fi
          done
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          [ -n "$summary" ] || summary="원인을 뽑지 못했습니다. Actions 로그를 확인해 주세요"
          echo "::error title=서버 빌드·테스트 실패::${summary:0:60000}"

  frontend:
    name: 화면 (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 타입 검사와 빌드
        run: npm run build
