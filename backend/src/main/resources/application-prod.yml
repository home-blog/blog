# 배포용. 모든 접속 정보는 환경 변수로 넣는다 (GitHub Secrets → 서버의 .env.deploy → docker-compose.deploy.yml)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  session:
    jdbc:
      initialize-schema: never
  # 실습 DB는 여럿이 함께 쓰고 사람마다 스키마가 따로다. 표는 DB_SCHEMA 안에 만든다 (접속 주소의 currentSchema도 같은 값)
  flyway:
    schemas: ${DB_SCHEMA:public}
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}

myblog:
  verification:
    secret: ${VERIFICATION_SECRET}   # 인증번호·증표 HMAC 비밀키 (32자 이상 무작위 값). 공개 저장소에 적지 않는다
    require-secret: true   # 비어 있거나 32자보다 짧으면 서버를 켜지 않는다

server:
  # 앞단 Nginx가 알려 준 원래 주소·프로토콜(X-Forwarded-*)을 믿는다 (실습 서버 Nginx → 화면 컨테이너 Nginx → 서버)
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}   # HTTPS에서만 쿠키 전송 (NF-10). HTTPS가 아직 없는 서버에서만 false
        http-only: true
        same-site: lax

# 원고 편지(specs/016) 속 링크의 사이트 주소. 도메인이 바뀌면 저장소 Variables SITE_URL로 덮어쓴다
subscription:
  newsletter:
    site-url: ${SITE_URL:https://geulgyeol.java21.net}

# Claude 앱 커스텀 커넥터(specs/023)의 OAuth 발급자 주소. 원고 편지와 같은 사이트 주소를 쓴다
mcp:
  oauth:
    issuer: ${MCP_OAUTH_ISSUER:${SITE_URL:https://geulgyeol.java21.net}}
