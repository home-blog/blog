# 개발용 (내 컴퓨터 + docker-compose). 메일은 기본으로 보내지 않고 서버 로그에 인증번호를 찍는다 (specs/001 research B-9)
# 로그 수준은 logback-spring.xml에서 정한다
#
# DB, Redis, 이미지 저장소, 메일 접속 정보는 저장소 맨 위의 .env에서 읽는다 (docker-compose.yml과 같은 파일).
# 처음이면 cp .env.example .env. 내 메일함으로 실제 인증 메일을 받으려면 .env의 MAIL_* 값을 채운다 (적는 법은 .env.example).
spring:
  config:
    # 맨 위 .env는 backend 폴더에서 실행하면(mvn, IntelliJ 실행 설정) ../.env, 저장소 맨 위에서 실행하면 ./.env다.
    # 실행 위치가 달라도 읽도록 둘 다 본다
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

# API 문서: 서버를 켜고 http://localhost:8080/swagger-ui.html (주소 버전 v1, 릴리스 번호가 머리에 보인다)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

myblog:
  mail:
    sender: ${MAIL_SENDER:log}

# 비슷한 글 (specs/014 D-17): 개발에서 열쇠·Ollama가 없으면 글자 조각 임베딩으로 뜻 경로를 돌려 본다 (배포는 태그·주제로 대신)
related:
  without-key: local
