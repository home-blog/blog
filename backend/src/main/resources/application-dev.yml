# 개발용 (내 컴퓨터 + docker-compose). 메일은 기본으로 보내지 않고 서버 로그에 인증번호를 찍는다 (specs/001 research B-9)
# 로그 수준은 logback-spring.xml에서 정한다
#
# DB, Redis, 이미지 저장소, 메일 접속 정보는 저장소 맨 위의 .env에서 읽는다 (docker-compose.yml과 같은 파일).
# 처음이면 cp .env.example .env. 내 메일함으로 실제 인증 메일을 받으려면 .env의 MAIL_* 값을 채운다 (적는 법은 .env.example).
spring:
  config:
    import: optional:file:../.env[.properties]   # 서버는 backend 폴더에서 실행한다 (mvn, IntelliJ 실행 설정 모두)

myblog:
  mail:
    sender: ${MAIL_SENDER:log}
