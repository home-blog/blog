# 공통 설정. 비밀 값은 환경 변수로만 넣는다 (공개 저장소). 로컬 개발에서는 저장소 맨 위의 .env에서 읽는다 (application-dev.yml).
# 기본값은 비밀이 아닌 것(내 컴퓨터 주소, 포트)만 둔다.
spring:
  application:
    name: myblog-server
  lifecycle:
    timeout-per-shutdown-phase: 30s   # 끌 때 처리 중인 요청을 기다리는 최대 시간 (graceful shutdown)
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myblog}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 표는 Flyway가 만든다. JPA는 확인만 한다
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s           # Redis가 응답하지 않으면 2초 뒤 "잠시 뒤 다시 시도"로 답한다 (기본 60초는 너무 길다)
      connect-timeout: 2s
  session:
    jdbc:
      initialize-schema: never   # 세션 표는 Flyway(V1__spring_session.sql)로 만든다
  mail:   # 인증번호 메일 (D-1). 계정은 환경 변수로만. Gmail·네이버 모두 587 포트 + STARTTLS + 로그인
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true   # 암호화 없이 보내지 않는다
      mail.smtp.connectiontimeout: 5000   # 메일 서버가 응답하지 않으면 5초 뒤 실패로 알린다 (D-2)
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  # 끌 때(배포) 새 요청은 받지 않고, 처리 중인 요청은 마치고 꺼진다 (specs/011). 기다림은 아래 lifecycle 시간까지.
  # docker-compose.deploy.yml의 stop_grace_period(40s)는 이보다 길어야 중간에 잘리지 않는다
  shutdown: graceful
  servlet:
    session:
      timeout: 7d   # 마지막 사용 후 7일 (CF-02-10)
      # 세션 쿠키(이름, 7일, HttpOnly, SameSite)는 user/config/SessionConfig.java에서 정한다. Secure는 prod 설정에서 켠다

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # 메일 서버가 잠깐 안 돼도 서버 전체를 고장으로 알리지 않는다. 발송 실패는 가입 화면에서 바로 알린다 (D-2)

# 기능 설정값은 한곳에서 (헌법 원칙 VI). 값은 docs의 specs/001 plan.md `설정값 목록`과 같다
auth:
  nickname:
    min-length: 2
    max-length: 10
  password:
    min-length: 8
    max-length: 20
    allowed-specials: "!@#$%^&*()_+-="
  email-verification:
    code-length: 6
    code-ttl: 10m
    resend-interval: 1m
    daily-limit: 5
    max-wrong-attempts: 5
    verified-ttl: 30m
  login:
    max-failed-attempts: 5
    lock-duration: 10m
  session:
    idle-timeout: 7d
    absolute-timeout: 30d

# 소셜 로그인 (specs/010). 열쇠(앱 등록 값)는 환경 변수로만 넣는다 (공개 저장소). 열쇠가 빈 회사는 버튼이 보이지 않는다 (D-9)
# 콜백 주소: {사이트 주소}/login/oauth2/code/{github|google|kakao|naver}
social:
  pending-ttl: 10m   # 회사 화면을 다녀온 뒤 소셜 가입을 마쳐야 하는 시간, 연결하기 표시의 유효 시간 (D-8)
  http-timeout: 5s   # 회사 서버에 따로 묻는 요청(GitHub 이메일 목록)의 연결·읽기 제한 시간
  clients:
    github:
      client-id: ${SOCIAL_GITHUB_CLIENT_ID:}
      client-secret: ${SOCIAL_GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${SOCIAL_GOOGLE_CLIENT_ID:}
      client-secret: ${SOCIAL_GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${SOCIAL_KAKAO_CLIENT_ID:}
      client-secret: ${SOCIAL_KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${SOCIAL_NAVER_CLIENT_ID:}
      client-secret: ${SOCIAL_NAVER_CLIENT_SECRET:}

# 계정 관리 (specs/002 plan.md 설정값 목록)
account:
  intro:
    min-length: 0
    max-length: 100

# 블로그·분류·글 (specs/003 plan.md 설정값 목록). 글자는 코드 포인트로 센다
blog:
  name:
    min-length: 1
    max-length: 30
  intro:
    min-length: 0
    max-length: 200
category:
  name:
    min-length: 1
    max-length: 20
  color-count: 6   # 분류 색 목록의 색 개수 (specs/006 T025). 색 값은 화면 index.css의 --category-1 ~ 6
post:
  title:
    min-length: 1
    max-length: 100
  content:
    min-length: 1
    max-length: 10000
  manuscript:   # 원고지 매수·읽는 시간 (specs/007 US3, 가안). 마크다운 기호를 뺀 글자 수(띄어쓰기 포함) ÷ 값, 올림
    chars-per-sheet: 200    # 200자 원고지
    chars-per-minute: 500   # 1분에 읽는 글자 수
    read-batch-size: 200    # 매수 합계(첫 화면 분량·블로그 머리)를 셀 때 본문을 한 번에 받아 오는 줄 수

# 글쓰기 도구 (specs/013 research, 가안)
writing:
  draft:
    max-count: 50            # 회원마다 둘 수 있는 임시 저장 글 (D-6)
    autosave-seconds: 30     # 화면의 자동 저장 간격, 바뀐 것이 있을 때만 (D-5)
    tags-max-length: 200     # 임시 저장 태그 칸(post_draft.tags, VARCHAR 200)
  schedule:
    max-days: 30             # 예약은 지금부터 이 날수 안 (N-09)
    min-lead: 1m             # 예약은 지금부터 이만큼 뒤부터
    check-interval: 1m       # 시각이 지난 예약을 올리는 작업 간격 (D-2)
    batch-size: 50           # 한 번에 올리는 예약 수
  activity:
    days: 365                # 잔디 기간: 오늘 포함 (D-12)
    zone: Asia/Seoul         # 잔디 날짜를 세는 시간대
series:
  name:
    min-length: 1
    max-length: 30
  description:
    max-length: 200
  max-per-blog: 50
  max-posts: 200

# 빨간 펜 교정 (specs/014 research D-1 ~ D-7, D-15)
proofread:
  provider: ${PROOFREAD_PROVIDER:auto}   # auto: 열쇠가 있으면 claude, 없으면 without-key / claude / rules / off
  without-key: rules                     # 열쇠가 없을 때: rules(서버 안의 규칙 교정, 무료, 횟수 안 셈) 또는 "off"(단추 숨김. off는 따옴표 필수, 없으면 YAML이 false로 읽는다)
  api-key: ${ANTHROPIC_API_KEY:}         # 환경 변수로만 (GitHub Secrets → 서버 .env.deploy)
  model: claude-opus-5-5
  effort: low              # 생각 깊이: 교정은 low로 충분하고 빠르다 (바깥 Nginx가 60초에 끊는다)
  max-tokens: 16000
  timeout: 50s             # Claude API 한 번의 제한 시간. 바깥 Nginx 60초보다 짧게
  max-retries: 0           # 실패하면 다시 보내는 횟수. 한 번이라도 다시 보내면 timeout × 2가 Nginx 60초를 넘을 수 있다
  daily-limit: 20          # 회원마다 하루 교정 횟수 (한국 날짜)
  max-length: 10000        # 본문 한도 = 글 본문 한도(post.content.max-length)
  max-corrections: 100     # 한 번에 돌려주는 고칠 곳 수
  original-max-length: 200 # 고칠 곳 원문 하나의 최대 글자 수. 더 길면 문단을 통째로 바꾸자는 것이라 받지 않는다
  reason-max-length: 120   # 화면에 보이는 이유의 최대 글자 수. 넘으면 자른다
  cache-ttl: 1d            # 같은 본문의 결과를 보관하는 시간
  count-margin: 10m        # 하루 횟수 키를 다음 한국 자정 뒤 더 두는 시간 (서버·Redis 시계가 조금 달라도 그날 안에 지워지지 않게)
  zone: Asia/Seoul

# 비슷한 글 (specs/014 research D-9 ~ D-13, D-15)
related:
  provider: ${RELATED_PROVIDER:auto}     # auto: Voyage 열쇠 → Ollama 주소 → without-key 순서 / voyage / ollama / local / off
  without-key: "off"                     # 둘 다 없을 때: "off"(태그·주제로 대신, 배포) 또는 local(글자 조각, 개발·시험용). off는 따옴표 필수
  api-key: ${VOYAGE_API_KEY:}            # 환경 변수로만 (GitHub Secrets → 서버 .env.deploy)
  base-url: https://api.voyageai.com/v1
  model: voyage-3.5
  ollama-url: ${RELATED_OLLAMA_URL:}     # 내 서버의 Ollama (배포는 OLLAMA_ENABLED이고 자원이 넉넉할 때만 http://ollama:11434를 넣는다)
  ollama-model: bge-m3                   # 한국어를 잘하는 다국어 임베딩, 1024칸 (dimensions와 같아야 한다)
  ollama-timeout: 120s                   # CPU로 돌아 Voyage보다 느리다. 정리 작업은 뒤에서 돌아 화면을 기다리게 하지 않는다
  dimensions: 1024         # post_embedding.embedding 길이. 바꾸면 모두 다시 만든다
  max-chars: 4000          # 임베딩하는 본문 앞부분 글자 수 (제목은 따로 붙인다)
  timeout: 20s
  batch-size: 32           # 한 번에 보내는 글 수, 정리 작업이 한 번에 확인하는 글 수
  backfill-interval: 10m   # 빠진 것·바뀐 것을 채우는 정리 작업 간격
  backfill-initial-delay: 1m
  count: 4                 # 보여 주는 비슷한 글 수
  per-blog: 2              # 한 블로그의 글은 이만큼까지
  max-candidates: 3000     # 뜻이 가까운지 견주는 공개 글 수 (최신순)
  tag-pool-factor: 4       # 태그로 대신할 때 고를 글 수(count × per-blog)의 몇 배를 후보로 읽을지
  queue-size: 200          # 저장 뒤 임베딩 대기열. 넘치면 버리고 정리 작업이 채운다
  cache-ttl: 10m           # 고른 비슷한 글 번호를 Redis에 두는 시간 (그 글의 뜻 정보가 바뀌면 바로 지운다)

# 로봇이 읽는 주소: RSS, 사이트 지도 (specs/007 US5·US6, 가안)
share:
  rss-size: 20              # RSS 한 번에 주는 최신 공개 글 수
  sitemap-max-posts: 5000   # 사이트 지도에 넣는 공개 글 수 (최신순)

# 글 목록·검색 (specs/004 plan.md 설정값 목록). 검색 결과도 같은 페이지 글 수·미리보기 길이를 쓴다 (D-3)
explore:
  list:
    page-size: 10
    preview-length: 100
  search:
    keyword-min-length: 2
    keyword-max-length: 50
  feed:              # 첫 화면 글 모음 (모든 블로그의 공개 글, 주제별)
    page-size: 12
    popular-size: 5   # 이번 주 인기 글 수
    popular-days: 7   # 인기 글을 고르는 기간 (오늘 포함)
    day-zone: ${stats.day-zone}
    summary-ttl: 5m   # 첫 화면 머리 분량(블로거·글·원고지 매수)을 다시 세기까지 (v0.5.1). 세려면 공개 글 본문을 모두 읽는다
  today-issue:       # 오늘의 이슈 (specs/015 US2): 오늘과 어제 조회수 합이 큰 공개 글, 블로그마다 하나
    size: 3
    days: 2          # 오늘 포함 (2 = 오늘과 어제, 한국 날짜는 feed.day-zone)
    ttl: 5m          # 고른 순서를 다시 쓰는 시간. 카드는 요청마다 다시 읽어 비공개로 바뀐 글은 바로 빠진다

# 댓글·좋아요·신고·태그·이미지 (specs/005 plan.md 설정값 목록). 글자는 코드 포인트로 센다
community:
  comment:
    min-length: 1
    max-length: 500
    min-interval: 5s   # 같은 회원의 댓글 사이 최소 간격 (CF-18-7)
  report:
    detail-max-length: 200   # 기타 사유의 설명 (CF-21-2)
  tag:
    max-per-post: 5   # 글 하나에 붙일 수 있는 태그 수 (CF-20-1)
    min-length: 1
    max-length: 15    # tag.name 칸(15)보다 길게 정하면 서버가 켜지지 않는다
    page-size: 10     # 태그별 글 목록 한 페이지 (004 목록과 같은 값, CF-10-2)
  image:
    max-size: 5MB          # 한 장 (CF-22-2). 파일 업로드의 프레임워크 크기 설정도 이 값에서 정한다 (ImageConfig)
    max-per-post: 10       # 글 하나 (CF-22-3)
    allowed-types: jpg, png, gif, webp   # 형식은 파일 앞부분의 형식 표시로 확인한다 (D-6)
    orphan-ttl: 24h        # 글에 연결되지 않은 이미지를 지우기까지 (CF-22-5, D-3, 가안)
    cleanup-interval: 1h   # 정리 작업 간격
    storage: s3            # s3(개발 MinIO) 또는 disk(서버 디스크) (D-1)
    s3:
      endpoint: ${IMAGE_S3_ENDPOINT:http://localhost:9000}
      region: ${IMAGE_S3_REGION:us-east-1}
      bucket: ${IMAGE_S3_BUCKET:myblog-images}
      access-key: ${IMAGE_S3_ACCESS_KEY:}   # 접속 키는 환경 변수로만 (개발용 값은 .env.example에)
      secret-key: ${IMAGE_S3_SECRET_KEY:}
    disk:
      directory: ${IMAGE_DISK_DIRECTORY:./data/images}
  clip:                    # 문장 수집·필사 노트 (specs/015 US3)
    max-length: 300        # 한 문장 (sentence_clip.text 칸(300)보다 길게 정하면 서버가 켜지지 않는다)
    max-per-member: 1000   # 한 사람이 모을 수 있는 문장 수
    page-size: 20          # 필사 노트 한 쪽

# 공지사항 (specs/012 research D-5, D-10). 글자는 코드 포인트로 센다. 릴리스 링크는 번호만 저장하고 이 틀로 만든다
notice:
  title:
    max-length: 100
  content:
    max-length: 10000
  page-size: 10
  release-url: https://github.com/home-blog/blog/releases/tag/v{version}
  release-url-from: 0.4.0   # GitHub 릴리스는 0.4.0부터 있다. 그 전 업데이트 글에는 링크를 붙이지 않는다

# 블로그 관리·통계 (specs/006 plan.md 설정값 목록). 값은 docs의 상세/06 기본값 표와 같다
manage:
  page-size: 10            # 글 관리·댓글 관리 한 쪽 (FR-012, FR-023)
  comment:
    preview-length: 50     # 댓글 관리의 앞부분 글자 수 (FR-024)
  dashboard:
    popular-days: 7        # 인기 글은 최근 7일 조회수로 (D-6)
    popular-size: 5
    recent-size: 5
    chart-days: 30         # 대시보드 그래프 (FR-007)
  stats:
    period-options: [7, 30]
    period-default: 30
stats:
  day-zone: Asia/Seoul     # 하루를 나누는 시간대 (FR-036)
  view:
    dedupe-window: 30m     # 같은 사람·같은 글은 30분에 한 번 (FR-033)
  visitor:
    cookie-name: MYBLOG_VISITOR
    cookie-max-age: 365d   # 비회원 방문자 쿠키 (D-2, 가안)
    visit-margin: 1h       # "오늘 왔다" 표시를 다음 한국 자정보다 이만큼 더 둔다 (시계 차이 여유)
  search-trend:            # 실시간 인기 검색어 (specs/015 US1, 가안)
    bucket: 10m            # 한 칸. 순위는 window-buckets칸(1시간)의 합, 변화는 한 칸 앞과 견준다
    window-buckets: 6
    dedupe-window: 10m     # 같은 사람·같은 검색어는 10분에 한 번
    size: 10
    min-count: 2           # 1시간 동안 이만큼 세어진 말만 보인다 (한 사람의 한 번 검색이 그대로 드러나지 않게)
    banned: []             # 들어 있으면 세지 않는 말 (배포에서 늘린다)

# API 문서(Swagger)는 기본으로 끈다. 개발 설정(application-dev.yml)에서만 켠다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

myblog:
  # 지금 릴리스 번호 (pom.xml의 version을 빌드할 때 채운다). API 문서 머리에 API 버전과 같이 보인다
  release: "@project.version@"
  mail:
    sender: smtp   # smtp(실제 발송) 또는 log(서버 로그에 인증번호만 찍기). dev 설정은 log가 기본
    from-name: 글결   # 받는 사람에게 보이는 보내는 사람 이름 (주소는 MAIL_USERNAME)
  verification:
    min-secret-length: 32   # 인증 비밀키(VERIFICATION_SECRET)의 최소 길이. 32보다 낮출 수 없다

# 무중단 배포 (specs/011): 배포에서는 앱 두 벌(a, b)을 같이 띄운다. 이름이 있으면 응답에 X-Instance로 붙인다. 로컬은 비워 둔다
instance:
  name: ${INSTANCE_NAME:}
