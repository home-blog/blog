# 공통 설정. 비밀 값은 환경 변수로만 넣는다 (공개 저장소). 기본값은 로컬 개발용이다.
spring:
  application:
    name: myblog-server
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:myblog-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 표는 Flyway가 만든다. JPA는 확인만 한다
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s           # Redis가 응답하지 않으면 2초 뒤 "잠시 뒤 다시 시도"로 답한다 (기본 60초는 너무 길다)
      connect-timeout: 2s
  session:
    jdbc:
      initialize-schema: never   # 세션 표는 Flyway(V1__spring_session.sql)로 만든다

server:
  servlet:
    session:
      timeout: 7d   # 마지막 사용 후 7일 (CF-02-10)
      # 세션 쿠키(이름, 7일, HttpOnly, SameSite)는 user/config/SessionConfig.java에서 정한다. Secure는 prod 설정에서 켠다

management:
  endpoints:
    web:
      exposure:
        include: health

# 기능 설정값은 한곳에서 (헌법 원칙 VI). 값은 docs의 specs/001 plan.md `설정값 목록`과 같다
auth:
  nickname:
    min-length: 2
    max-length: 10
  password:
    min-length: 8
    max-length: 20
    allowed-specials: "!@#$%^&*()_+-="
  email-verification:
    code-length: 6
    code-ttl: 10m
    resend-interval: 1m
    daily-limit: 5
    max-wrong-attempts: 5
    verified-ttl: 30m
  login:
    max-failed-attempts: 5
    lock-duration: 10m
  session:
    idle-timeout: 7d
    absolute-timeout: 30d

# 계정 관리 (specs/002 plan.md 설정값 목록)
account:
  intro:
    min-length: 0
    max-length: 100

# 블로그·분류·글 (specs/003 plan.md 설정값 목록). 글자는 코드 포인트로 센다
blog:
  name:
    min-length: 1
    max-length: 30
  intro:
    min-length: 0
    max-length: 200
category:
  name:
    min-length: 1
    max-length: 20
  color-count: 6   # 분류 색 목록의 색 개수 (specs/006 T025). 색 값은 화면 index.css의 --category-1 ~ 6
post:
  title:
    min-length: 1
    max-length: 100
  content:
    min-length: 1
    max-length: 10000

# 글 목록·검색 (specs/004 plan.md 설정값 목록). 검색 결과도 같은 페이지 글 수·미리보기 길이를 쓴다 (D-3)
explore:
  list:
    page-size: 10
    preview-length: 100
  search:
    keyword-min-length: 2
    keyword-max-length: 50

# 댓글·좋아요·신고·태그·이미지 (specs/005 plan.md 설정값 목록). 글자는 코드 포인트로 센다
community:
  comment:
    min-length: 1
    max-length: 500
    min-interval: 5s   # 같은 회원의 댓글 사이 최소 간격 (CF-18-7)

# 블로그 관리·통계 (specs/006 plan.md 설정값 목록). 값은 docs의 상세/06 기본값 표와 같다
manage:
  page-size: 10            # 글 관리·댓글 관리 한 쪽 (FR-012, FR-023)
  comment:
    preview-length: 50     # 댓글 관리의 앞부분 글자 수 (FR-024)
  dashboard:
    popular-days: 7        # 인기 글은 최근 7일 조회수로 (D-6)
    popular-size: 5
    recent-size: 5
    chart-days: 30         # 대시보드 그래프 (FR-007)
  stats:
    period-options: [7, 30]
    period-default: 30
stats:
  day-zone: Asia/Seoul     # 하루를 나누는 시간대 (FR-036)
  view:
    dedupe-window: 30m     # 같은 사람·같은 글은 30분에 한 번 (FR-033)
  visitor:
    cookie-name: MYBLOG_VISITOR
    cookie-max-age: 365d   # 비회원 방문자 쿠키 (D-2, 가안)

myblog:
  verification:
    min-secret-length: 32   # 인증 비밀키(VERIFICATION_SECRET)의 최소 길이. 32보다 낮출 수 없다
