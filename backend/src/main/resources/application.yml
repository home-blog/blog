# 공통 설정. 비밀 값은 환경 변수로만 넣는다 (공개 저장소). 기본값은 로컬 개발용이다.
spring:
  application:
    name: myblog-server
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myblog}
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:myblog-dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 표는 Flyway가 만든다. JPA는 확인만 한다
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s           # Redis가 응답하지 않으면 2초 뒤 "잠시 뒤 다시 시도"로 답한다 (기본 60초는 너무 길다)
      connect-timeout: 2s
  session:
    jdbc:
      initialize-schema: never   # 세션 표는 Flyway(V1__spring_session.sql)로 만든다

server:
  servlet:
    session:
      timeout: 7d   # 마지막 사용 후 7일 (CF-02-10)
      # 세션 쿠키(이름, 7일, HttpOnly, SameSite)는 user/config/SessionConfig.java에서 정한다. Secure는 prod 설정에서 켠다

management:
  endpoints:
    web:
      exposure:
        include: health

# 기능 설정값은 한곳에서 (헌법 원칙 VI). 값은 docs의 specs/001 plan.md `설정값 목록`과 같다
auth:
  nickname:
    min-length: 2
    max-length: 10
  password:
    min-length: 8
    max-length: 20
    allowed-specials: "!@#$%^&*()_+-="
  email-verification:
    code-length: 6
    code-ttl: 10m
    resend-interval: 1m
    daily-limit: 5
    max-wrong-attempts: 5
    verified-ttl: 30m
  login:
    max-failed-attempts: 5
    lock-duration: 10m
  session:
    idle-timeout: 7d
    absolute-timeout: 30d

# 계정 관리 (specs/002 plan.md 설정값 목록)
account:
  intro:
    min-length: 0
    max-length: 100

# 블로그·분류·글 (specs/003 plan.md 설정값 목록). 글자는 코드 포인트로 센다
blog:
  name:
    min-length: 1
    max-length: 30
  intro:
    min-length: 0
    max-length: 200
category:
  name:
    min-length: 1
    max-length: 20
post:
  title:
    min-length: 1
    max-length: 100
  content:
    min-length: 1
    max-length: 10000

myblog:
  verification:
    min-secret-length: 32   # 인증 비밀키(VERIFICATION_SECRET)의 최소 길이. 32보다 낮출 수 없다
