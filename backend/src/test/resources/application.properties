# 테스트 전용 설정 (main의 application.yml 위에 덮는다)
# 테스트마다 설정이 다르면 Spring이 서버를 따로 띄워 두고(컨텍스트 캐시) 각자 DB 연결 묶음을 잡는다.
# 기본값(10개, 놀아도 10개 유지)이면 컨텍스트가 늘어날 때 PostgreSQL 연결 수(100)를 넘으므로 작게 잡고, 놀면 줄인다
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
