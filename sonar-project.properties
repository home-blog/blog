# SonarQube 분석 설정 (서버 주소와 토큰은 GitHub에서 넣는다: sonar.yml 참고)
sonar.projectKey=myblog-jaeung
sonar.projectName=myblog-jaeung
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
# 화면 테스트는 소스 옆에 있어서(*.test.ts) 테스트로 따로 묶는다. 서버 테스트 폴더는 통째로 테스트다
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
# 화면 커버리지 (Vitest + v8, npm run test:coverage)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# 시작 파일은 화면을 붙이기만 해서 커버리지에서 뺀다
sonar.coverage.exclusions=frontend/src/main.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
# Quality Gate는 아직 머지 조건으로 걸지 않는다 (sonar.qualitygate.wait 없음, 2026-10-15).
# 아카데미 SonarQube는 브랜치·PR을 나누어 보지 않아(Community Edition) 게이트가 이 PR이 아니라 프로젝트 전체의
# "새 코드 기간"을 본다. 화면 커버리지를 처음 넣자 테스트가 없던 화면 코드가 새 코드로 잡혀 모든 PR이 실패했다.
# 새 코드 기준을 "이전 버전"으로 두고(sonar.projectVersion = 릴리스 번호, sonar.yml) 화면 테스트가 늘면 다시 켠다.
# 결과는 품질 분석 화면에서 사람이 본다 (docs/3-설계/테스트-전략.md 6절)
