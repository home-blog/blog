# 개발용 서비스 (specs/001 T004). 실행: docker compose up -d
# 비밀번호는 개발 전용 값이다. 배포에는 쓰지 않는다.
services:
  postgres:
    image: pgvector/pgvector:pg18   # PostgreSQL 18 + pgvector(임베딩 저장·비교용 확장, 나중에 쓸 때 대비)
    environment:
      POSTGRES_DB: myblog
      POSTGRES_USER: myblog
      POSTGRES_PASSWORD: myblog-dev
    ports:
      - "127.0.0.1:5432:5432"   # 내 컴퓨터에서만 접속
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myblog -d myblog"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
