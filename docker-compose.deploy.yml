# 배포용 (실습 서버 등). 실행: docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d --build
# 여는 포트는 화면 입구(WEB_PORT) 하나뿐이고, 그것도 이 서버 안(127.0.0.1)에서만 받는다. 밖에서는 실습 서버 Nginx를 거쳐야 한다.
# DB·Redis·이미지 저장소·서버는 컨테이너끼리만 통한다 (같은 서버를 여러 사람이 쓰므로). 값은 .env.deploy에서 읽는다 (견본 .env.deploy.example)
# 이름(DEPLOY_NAME)은 같은 서버의 다른 사람 컨테이너·데이터와 섞이지 않게 나만 쓰는 이름으로 정한다
name: ${DEPLOY_NAME:?.env.deploy에 DEPLOY_NAME을 적으세요}

services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:?.env.deploy에 WEB_PORT를 적으세요}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-myblog}
      DB_USERNAME: ${DB_USERNAME:-myblog}
      DB_PASSWORD: ${DB_PASSWORD:?.env.deploy에 DB_PASSWORD를 적으세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IMAGE_S3_ENDPOINT: http://minio:9000
      IMAGE_S3_BUCKET: ${IMAGE_S3_BUCKET:-myblog-images}
      IMAGE_S3_ACCESS_KEY: ${IMAGE_S3_ACCESS_KEY:?.env.deploy에 IMAGE_S3_ACCESS_KEY를 적으세요}
      IMAGE_S3_SECRET_KEY: ${IMAGE_S3_SECRET_KEY:?.env.deploy에 IMAGE_S3_SECRET_KEY를 적으세요}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:?.env.deploy에 VERIFICATION_SECRET(32자 이상)을 적으세요}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_NAME:-myblog}
      POSTGRES_USER: ${DB_USERNAME:-myblog}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${IMAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${IMAGE_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
