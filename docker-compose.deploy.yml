# 배포용 (실습 서버). 보통은 GitHub Actions(.github/workflows/deploy.yml)가 이미지를 만들어 서버에 올리고
# deploy/remote-deploy.sh가 이 파일로 켠다. 값은 서버의 .env.deploy(Actions가 GitHub Secrets로 만든다)에서 읽는다.
# - DB는 실습 DB(PostgreSQL)를 쓴다. 표는 DB_SCHEMA 스키마 안에 Flyway가 만든다
# - 여는 포트는 화면 입구(WEB_PORT) 하나뿐이고, 그것도 이 서버 안(127.0.0.1)에서만 받는다. 밖에서는 실습 서버 Nginx를 거친다
# - Redis·이미지 저장소(MinIO)는 컨테이너끼리만 통한다 (같은 서버를 여러 사람이 쓰므로)
# - 이름(DEPLOY_NAME)은 같은 서버의 다른 사람 컨테이너·데이터와 섞이지 않게 나만 쓰는 이름
name: ${DEPLOY_NAME:?DEPLOY_NAME이 없습니다}

services:
  web:
    image: ${DEPLOY_NAME}-web:${IMAGE_TAG:-local}
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT가 없습니다}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    image: ${DEPLOY_NAME}-server:${IMAGE_TAG:-local}
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://${DB_ADDRESS:?DB_ADDRESS가 없습니다}:${DB_PORT:-5432}/${DB_NAME:?DB_NAME이 없습니다}?currentSchema=${DB_SCHEMA:-public}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME이 없습니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없습니다}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      IMAGE_S3_ENDPOINT: http://minio:9000
      IMAGE_S3_BUCKET: ${IMAGE_S3_BUCKET:-myblog-images}
      IMAGE_S3_ACCESS_KEY: ${IMAGE_S3_ACCESS_KEY:?IMAGE_S3_ACCESS_KEY가 없습니다}
      IMAGE_S3_SECRET_KEY: ${IMAGE_S3_SECRET_KEY:?IMAGE_S3_SECRET_KEY가 없습니다}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:?VERIFICATION_SECRET(32자 이상)이 없습니다}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    # DB가 같은 서버(localhost)에 있을 때 컨테이너 안에서 닿는 이름 (remote-deploy.sh가 주소를 바꿔 준다)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${IMAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${IMAGE_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  minio-data:
